name: glancecard
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gfazioli/glancecard@v0.6.1
        with:
          profile: chrismessina
          repos: |
            chrismessina/alfred-theme-monterey
            chrismessina/alfred-twitter-toolkit
            chrismessina/alfred-app
          time-zone: America/Los_Angeles
